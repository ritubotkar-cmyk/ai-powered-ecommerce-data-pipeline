
services:
  ecommerce-app:
    build: .
    container_name: ecommerce-ai-dashboard

    ports:
      - "127.0.0.1:8501:8501"

    env_file:
      - .env

    environment:
      ECOMMERCE_DB_HOST: host.docker.internal
      ECOMMERCE_DB_PORT: "5432"
      OLLAMA_URL: http://host.docker.internal:11434/api/generate

    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs

    restart: unless-stopped
